# Render Blueprint — Parvah (Next.js + custom Socket.io server)
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: parvah
    runtime: node
    # starter (~512MB) OOMs under chat + Next traffic spikes — use standard+ in dashboard if crashes continue
    plan: starter
    region: singapore # or closest to your users
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: ALLOWED_ORIGINS
        value: https://parvah.online
      - key: GOOGLE_SITE_VERIFICATION
        sync: false # paste code from Search Console → HTML tag method
      - key: NEXT_PUBLIC_GTM_ID
        value: GTM-MF9GKBNC
    autoDeploy: true
